<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f5fbf"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>一般溫度計查驗</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e3e6eb;--pri:#1f5fbf;--ok:#15803d;--okbg:#e7f6ec;--ng:#b91c1c;--ngbg:#fdecec;--warn:#92400e;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8eaed;--mute:#9aa1ab;--line:#2d333c;--pri:#6aa0ff;--ok:#4ade80;--okbg:#16301f;--ng:#f87171;--ngbg:#3a1a1a;--warn:#fbbf24;--warnbg:#3a2e12}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
.sync{font-size:12px;color:var(--mute)}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:14px;color:var(--mute);font-family:inherit}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:10px;cursor:pointer}
.item .nm{font-weight:600}
.item .sub{font-size:13px;color:var(--mute);margin-top:2px}
.grow{flex:1;min-width:0}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--mute)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.ng{background:var(--ngbg);color:var(--ng)}.badge.part{background:var(--warnbg);color:var(--warn)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
input:focus{outline:2px solid var(--pri);outline-offset:-1px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:15px;font-family:inherit;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--ng)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.rd{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.rd h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.numwrap{display:flex;gap:4px}
.numwrap input{flex:1}
.pm{flex:0 0 44px;padding:0;font-size:18px}
.res{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:15px}
.res b{font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--mute);line-height:1.5}
.top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.top h2{flex:1;font-size:18px;margin:0}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;flex:0 0 20px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal .card{max-width:420px;width:100%}
.mini{font-size:13px;padding:6px 10px}
.grp{margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:8px;padding:4px 2px 6px}
.ghead .nm{font-weight:700;font-size:16px}
.ghead .sub{font-size:12px;color:var(--mute)}
.unit{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.unit:first-child{border-top:0}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.code{font-weight:600}
details summary{cursor:pointer;color:var(--pri);font-size:14px;padding:4px 0}
table.pts{width:100%;border-collapse:collapse;font-size:14px}
table.pts td,table.pts th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.warn{color:var(--warn)}
.formula{font-size:12px;color:var(--mute);margin-top:2px;word-break:break-all}
</style>
</head>
<body>
<header><h1>一般溫度計查驗</h1><span class="sync" id="sync">載入中…</span></header>
<main id="main"></main>
<nav>
  <button data-tab="m" class="on">量測</button>
  <button data-tab="c">校正報告</button>
  <button data-tab="s">設定</button>
  <button data-tab="x">匯出 Word</button>
</nav>

// ===== 把原始 Word 表單（.docx）轉成可填值的範本 =====
var WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';

function wEl(doc,name){return doc.createElementNS(WNS,'w:'+name)}
function setRunText(r,text){var ts=wKids(r,'t');ts.forEach(function(t){r.removeChild(t)});var t=wEl(r.ownerDocument,'t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=text;r.appendChild(t)}

var PPR_ORDER=['pStyle','keepNext','keepLines','pageBreakBefore','framePr','widowControl','numPr','suppressLineNumbers','pBdr','shd','tabs','suppressAutoHyphens','kinsoku','wordWrap','overflowPunct','topLinePunct','autoSpaceDE','autoSpaceDN','bidi','adjustRightInd','snapToGrid','spacing','ind','contextualSpacing','mirrorIndents','suppressOverlap','jc','textDirection','textAlignment','textboxTightWrap','outlineLvl','divId','cnfStyle','rPr','sectPr','pPrChange'];
function pPrOf(p){var pp=wFirst(p,'pPr');if(!pp){pp=wEl(p.ownerDocument,'pPr');p.insertBefore(pp,p.firstChild)}return pp}
function pPrSet(p,el){var pp=pPrOf(p),name=el.localName,old=wFirst(pp,name);if(old)pp.removeChild(old);
  var my=PPR_ORDER.indexOf(name);for(var n=pp.firstChild;n;n=n.nextSibling){if(n.nodeType===1&&PPR_ORDER.indexOf(n.localName)>my){pp.insertBefore(el,n);return}}pp.appendChild(el)}
function runsOf(p){return wKids(p,'r')}
function findRun(rs,s,from){for(var i=from||0;i<rs.length;i++)if(rText(rs[i]).indexOf(s)>=0)return i;return -1}
function blank(s){return !s.replace(/[\s　]/g,'')}
function tabLine(p,label,endLabel,key){
  var rs=runsOf(p),iL=findRun(rs,label),iE=findRun(rs,endLabel,iL+1); if(iL<0||iE<0) throw new Error('找不到「'+label+'」或「'+endLabel+'」');
  var k=iL; while(k<iE&&rText(rs[k]).indexOf('：')<0&&rText(rs[k]).indexOf(':')<0)k++; if(k>=iE)k=iL;
  var base=rs[k];
  if(key){var vi=-1;for(var i=k+1;i<iE;i++)if(!blank(rText(rs[i]))){vi=i;break}
    var v; if(vi>=0){v=rs[vi]}else{v=cloneRunEmpty(rs[k]);insertAfter(rs[k],v)} setRunText(v,'{{'+key+'}}');
    for(var j=k+1;j<iE;j++)if(rs[j]!==v)p.removeChild(rs[j]); base=v;}
  else for(var j2=k+1;j2<iE;j2++)p.removeChild(rs[j2]);
  var tr=cloneRunEmpty(base);tr.appendChild(wEl(p.ownerDocument,'tab'));insertAfter(base,tr);
  var pp=pPrOf(p),ind=wFirst(pp,'ind');if(ind)pp.removeChild(ind);
  var tabs=wEl(p.ownerDocument,'tabs'),t=wEl(p.ownerDocument,'tab');t.setAttributeNS(WNS,'w:val','left');t.setAttributeNS(WNS,'w:pos','4800');tabs.appendChild(t);pPrSet(p,tabs);
}
function dateRuns(p){
  var rs=runsOf(p),i0=findRun(rs,'內校日期'); if(i0<0) throw new Error('找不到「內校日期」');
  [['年','Y'],['月','M'],['日','D']].forEach(function(x){rs=runsOf(p);var j=-1;for(var i=i0+1;i<rs.length;i++){var tt=rText(rs[i]).trim();if(tt===x[0]){j=i;break}}
    if(j<0) throw new Error('找不到日期的「'+x[0]+'」');
    var prev=rs[j-1]; if(j-1>i0&&/^[\s　\d]*$/.test(rText(prev))) setRunText(prev,'{{'+x[1]+'}}');
    else{var n=cloneRunEmpty(rs[j]);setRunText(n,'{{'+x[1]+'}}');p.insertBefore(n,rs[j])}});
}
function valueAfter(p,label,key,pattern){
  var rs=runsOf(p),i=findRun(rs,label); if(i<0) throw new Error('找不到「'+label+'」');
  for(var j=i+1;j<rs.length;j++){var tt=rText(rs[j]);if(blank(tt))continue; if(!pattern||pattern.test(tt.trim())){setRunText(rs[j],'{{'+key+'}}');return} break}
  var n=cloneRunEmpty(rs[i]);setRunText(n,'{{'+key+'}}');insertAfter(rs[i],n);
}
function setCell(tc,text){var p=wFirst(tc,'p'),rs=runsOf(p);
  if(!rs.length){var r=wEl(p.ownerDocument,'r');var prp=p.getElementsByTagNameNS(WNS,'pPr')[0];var rp=prp&&wFirst(prp,'rPr');
    if(rp){var c=wEl(p.ownerDocument,'rPr');for(var n=rp.firstChild;n;n=n.nextSibling)c.appendChild(n.cloneNode(true));r.appendChild(c)} p.appendChild(r);rs=[r]}
  for(var i=1;i<rs.length;i++)p.removeChild(rs[i]); setRunText(rs[0],text);
  wKids(tc,'p').slice(1).forEach(function(x){wKids(x,'r').forEach(function(r){x.removeChild(r)})});}
function setOk(tc,key){var p=wFirst(tc,'p'),rs=runsOf(p),b=rs.filter(function(r){return rText(r)==='□'||rText(r)==='■'});
  if(b.length===2){setRunText(b[0],'{{'+key+'A}}');setRunText(b[1],'{{'+key+'B}}')} else setCell(tc,'{{'+key+'A}}是 {{'+key+'B}}否')}
function convertFormXml(xml){
  var doc=new DOMParser().parseFromString(xml,'application/xml');
  var body=doc.getElementsByTagNameNS(WNS,'body')[0], kids=[];for(var n=body.firstChild;n;n=n.nextSibling)if(n.nodeType===1)kids.push(n);
  var sect=kids[kids.length-1].localName==='sectPr'?kids[kids.length-1]:null;
  var end=-1;for(var i=0;i<kids.length;i++){if(kids[i].localName==='p'&&rText(kids[i]).indexOf('查驗人員')>=0){end=i;break}}
  if(end<0) throw new Error('找不到「查驗人員」，無法判斷第一頁的範圍');
  kids.forEach(function(k,i){if(i>end&&k!==sect)body.removeChild(k)});
  var page=kids.slice(0,end+1), ps=page.filter(function(k){return k.localName==='p'});
  var find=function(s){for(var i=0;i<ps.length;i++)if(rText(ps[i]).indexOf(s)>=0)return ps[i];throw new Error('找不到「'+s+'」')};
  var first=page[0]; if(first.localName==='p') pPrSet(first,wEl(doc,'pageBreakBefore'));
  var p1=find('溫度計編號'); dateRuns(p1); tabLine(p1,'溫度計編號','內校日期','NAME');
  tabLine(find('溫度計型式'),'溫度計型式','環境溫度','TYPE');
  tabLine(find('溫度計範圍'),'溫度計範圍','相對溼度',null);
  valueAfter(find('標準溫度計型號'),'標準溫度計型號','STDMODEL');
  valueAfter(find('校正報告編號'),'校正報告編號','REPORT',/^[A-Za-z0-9\-_.]+$/);
  var tbl=page.filter(function(k){return k.localName==='tbl'&&rText(k).indexOf('比對溫度')>=0&&rText(k).indexOf('是否合格')>=0})[0];
  if(!tbl) throw new Error('找不到查驗結果表格');
  var rows=wKids(tbl,'tr'); if(rows.length<6||rText(rows[5]).indexOf('平均')<0) throw new Error('查驗結果表格的列數和原表單不同');
  for(var k=0;k<3;k++){var cs=wKids(rows[2+k],'tc');if(cs.length<7)throw new Error('查驗結果表格的欄數和原表單不同');
    ['T','SR','SE','GR','GE','ACC'].forEach(function(key,ci){setCell(cs[ci],key==='ACC'?'{{ACC}}':'{{'+key+(k+1)+'}}')}); setOk(cs[6],'OK'+(k+1));}
  var ca=wKids(rows[5],'tc'); if(ca.length<4) throw new Error('平均列的欄數和原表單不同');
  setCell(ca[1],'{{GEAVG}}'); setCell(ca[2],'{{ACC}}'); setOk(ca[3],'OKAVG');
  return new XMLSerializer().serializeToString(doc).replace(/ w14:(paraId|textId)="[^"]*"/g,'');
}

async function checkForm(JSZipCls,bytes){
  var zip;try{zip=await JSZipCls.loadAsync(bytes)}catch(e){throw new Error('這不是 Word（.docx）檔')} var f=zip.file('word/document.xml'); if(!f) throw new Error('這不是 Word（.docx）檔');
  var xml=await f.async('string'); if(xml.indexOf('{{NAME}}')>=0) return true; convertFormXml(xml); return true;
}
// 產生整份 Word：每台儀器一頁
async function buildDocx(JSZipCls, templateBytes, settings, list, outType){
  var zip=await JSZipCls.loadAsync(templateBytes);
  var xml=await zip.file('word/document.xml').async('string');
  if(xml.indexOf('{{NAME}}')<0) xml=convertFormXml(xml);
  var bs=xml.indexOf('<w:body>')+'<w:body>'.length;
  var se=xml.lastIndexOf('<w:sectPr');
  var head=xml.slice(0,bs), page=xml.slice(bs,se), tail=xml.slice(se);
  var dp=dateParts(settings.date, settings.roc);
  var pageNo=0;
  var out=list.map(function(item){
    var inst=item.inst, c=computeInst(inst,item.rec,settings.cal,settings.geDec);
    var name=(inst.name+(inst.code?' '+inst.code:''));
    var map={ NAME:name, SHAPEID:'_x0000_i'+(3000+pageNo++), Y:dp.Y, M:dp.M, D:dp.D, TYPE:inst.type||'數字',
      STDMODEL:(settings.cal&&settings.cal.model)||'', REPORT:(settings.cal&&settings.cal.report)||'', ACC:inst.acc||'',
      GEAVG:c.avg.ge, OKAVGA:c.avg.ok===true?'■':'□', OKAVGB:c.avg.ok===false?'■':'□' };
    c.rows.forEach(function(r,i){ var k=i+1;
      map['T'+k]=r.t; map['SR'+k]=r.sr; map['SE'+k]=r.se; map['GR'+k]=r.gr; map['GE'+k]=r.ge; map['OK'+k+'A']=r.ok===true?'■':'□'; map['OK'+k+'B']=r.ok===false?'■':'□'; });
    var pg=page.replace(/\{\{(\w+)\}\}/g,function(_,k){ return xmlEsc(map[k]!=null?map[k]:''); });
    var idmap={}; return pg.replace(/_x0000_i(\d+)/g,function(m){ if(m===map.SHAPEID) return m; if(!idmap[m]) idmap[m]='_x0000_i'+(5000+pageNo*20+Object.keys(idmap).length); return idmap[m]; });
  }).join('');
  zip.file('word/document.xml', head+out+tail);
  return zip.generateAsync({type:outType||'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE'});
}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}

  clearTimeout(q.timer);

    if(q.busy){q.again=true;return}

function resetBox(){return new Promise(function(res){var m=document.createElement('div');m.className='modal';
  var opt=function(id,t,sub,on){return '<label class="chk" style="color:var(--ink);margin:0"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span class="grow">'+t+(sub?'<div class="hint">'+sub+'</div>':'')+'</span></label>'};
  m.innerHTML='<div class="card"><div style="font-weight:600;margin-bottom:6px">重置，準備新一年的查驗</div><div class="hint" style="margin-bottom:6px">請先確認今年的 Word 已經匯出存檔。重置後資料無法復原。</div>'+
    opt('r_rec','清除所有量測值','',true)+opt('r_date','清除內校日期','',true)+opt('r_code','清除所有設備編號','名稱、比對溫度、允收標準會保留',true)+opt('r_dup','每個類別只保留一台','刪除同類別多出來的設備',false)+
    '<div class="hint" style="margin-top:8px">校正報告資料不會被清除。</div><div class="row" style="margin-top:12px"><button class="btn" data-a="0">取消</button><button class="btn pri" data-a="1" style="background:var(--ng);border-color:var(--ng)">重置</button></div></div>';
  m.onclick=function(e){var a=e.target.getAttribute('data-a');if(a==null)return;var o={rec:m.querySelector('#r_rec').checked,date:m.querySelector('#r_date').checked,code:m.querySelector('#r_code').checked,dup:m.querySelector('#r_dup').checked};m.remove();res(a==='1'?o:null)};
  document.body.appendChild(m)})}
async function doReset(){
  var o=await resetBox(); if(!o) return;
  if(!o.rec&&!o.date&&!o.code&&!o.dup){toast('沒有選任何項目');return}
  if(!(await confirmBox('確定要重置嗎？這個動作無法復原。'))) return;
  setSync('重置中…');
  try{
    if(o.dup){var seen={};S.insts=S.insts.filter(function(i){if(seen[i.name])return false;seen[i.name]=1;return true})}
    if(o.code) S.insts.forEach(function(i){i.code=''});
    if(o.date) S.settings.date='';
    if(o.rec){
      var ids=Object.keys(S.recs);
      if(mode==='cloud'){ ids.forEach(function(id){pendingRec[id]=true}); for(var k=0;k<ids.length;k++){ await db.doc('recs/'+ids[k]).delete(); delete pendingRec[ids[k]]; } }
      else lsSet('tc_recs',{});
      S.recs={};
    }
    if(o.dup&&mode==='cloud'){ /* 被刪除設備的量測值一併清掉 */ var keep={};S.insts.forEach(function(i){keep[i.id]=1}); for(var id in S.recs){ if(!keep[id]){ await db.doc('recs/'+id).delete(); delete S.recs[id]; } } }
    saveConfig(); exportSel={}; render(); toast('已重置');
  }catch(e){ setSync('重置失敗'); toast('重置失敗：'+(e&&e.code||e)) }
}

     '<div class="row" style="margin-bottom:8px"><button class="btn mini" id="b_cfg">匯出設定檔</button><button class="btn mini" id="b_all">完整備份</button></div>'+
     '<button class="btn mini" id="b_imp" style="width:100%">匯入檔案（設定檔或完整備份）</button><input type="file" id="b_file" accept=".json,application/json" style="display:none">'+
     '</div>':'')+'<div class="card hint">'+(mode==='cloud'?'資料存在雲端，手機和電腦開同一個連結看到的是同一份。':'資料只存在這台裝置的瀏覽器裡，不會上傳。換手機、清除瀏覽器資料或用無痕模式都會讓資料消失，請量完盡快匯出 Word。iPhone 請用「加入主畫面」開啟，避免 Safari 自動清除長時間未使用的網站資料。')+'</div>';
  m.innerHTML=h;
  var save=function(){s.geDec=$('#s_dec').value;s.date=$('#s_date').value;s.roc=$('#s_roc').value==='1';saveConfig()};
  if($('#t_imp')){
    $('#t_imp').onclick=function(){$('#t_file').click()};
    $('#t_file').onchange=async function(){var f=this.files[0];this.value='';if(!f)return;
      try{var u=new Uint8Array(await f.arrayBuffer());await checkForm(JSZip,u);
        lsSet('tc_tpl',{name:f.name,at:new Date().toLocaleDateString('zh-TW'),b64:bytesToB64(u)});
        if(!lsGet('tc_tpl')){toast('手機儲存空間不足，無法保存表單');return}
        render();toast('表單已匯入')}
      catch(e){await confirmBox('這個檔案無法當作表單使用：'+(e&&e.message||e)+'。請確認是用 Word 另存的 .docx 查驗報告表單（舊版 .doc 需先用 Word 另存成 .docx）。')}};
  }
  if($('#b_cfg')){
    var stamp=function(){return new Date().toISOString().slice(0,10).replace(/-/g,'')};
    $('#b_cfg').onclick=function(){saveFile('溫度計查驗_設定檔_'+stamp()+'.json',new Blob([JSON.stringify({kind:'tc-config',v:1,settings:Object.assign({},S.settings,{date:''}),insts:S.insts},null,1)],{type:'application/json'}))};
    $('#b_all').onclick=function(){saveFile('溫度計查驗_完整備份_'+stamp()+'.json',new Blob([JSON.stringify({kind:'tc-backup',v:1,settings:S.settings,insts:S.insts,recs:S.recs},null,1)],{type:'application/json'}))};
    $('#b_imp').onclick=function(){$('#b_file').click()};
    $('#b_file').onchange=async function(){var f=this.files[0];this.value='';if(!f)return;
      var d;try{d=JSON.parse(await f.text())}catch(e){toast('檔案格式不正確');return}
      if(!d||!(d.kind==='tc-config'||d.kind==='tc-backup')||!Array.isArray(d.insts)){toast('這不是本工具的檔案');return}
      var full=d.kind==='tc-backup';
      if(!(await confirmBox(full?'匯入完整備份會取代這支手機上的儀器清單、校正報告和所有量測值，確定嗎？':'匯入設定檔會取代儀器清單和校正報告（已輸入的量測值會保留），確定嗎？')))return;
      applyCfg({settings:Object.assign({},d.settings||{},full?{}:{date:S.settings.date}),insts:d.insts});saveConfig();
      if(full){S.recs=d.recs||{};lsSet('tc_recs',S.recs)}
      render();toast('已匯入')};
  }
  ['s_dec','s_date','s_roc'].forEach(function(id){$('#'+id).oninput=save;$('#'+id).onchange=save});
}
var exportSel={}, expOpen={}, expQuery='';
function renderExport(m){
  S.insts.forEach(function(i){if(exportSel[i.id]==null)exportSel[i.id]=true});
  var miss=[];if(!S.settings.date)miss.push('內校日期（設定）');if(!S.settings.cal.report)miss.push('校正報告編號（校正報告）');
  var noCode=S.insts.filter(function(i){return !i.code}).length; if(noCode) miss.push(noCode+' 台未填編號');
  var h='<div class="top"><h2>匯出 Word</h2></div>'+
    (miss.length?'<div class="card hint warn">尚未填：'+miss.join('、')+'</div>':'')+
    '<input id="eq" type="search" placeholder="搜尋名稱或編號" value="'+esc(expQuery)+'" style="margin-bottom:8px">'+
    '<div class="row" style="margin-bottom:8px"><button class="btn mini" id="all">全選</button><button class="btn mini" id="none">全不選</button><button class="btn mini" id="done">只選已完成</button></div>'+
    '<div id="elist"></div>'+
    '<button class="btn pri" id="go" style="width:100%;margin-top:6px"></button><div class="hint" style="margin-top:8px">一台一頁，依清單順序。未輸入的欄位會留白，是否合格會自動勾選 ■。</div>';
  m.innerHTML=h;
  function count(){var n=S.insts.filter(function(i){return exportSel[i.id]}).length;$('#go').textContent='產生 Word（已選 '+n+' 台）';$('#go').disabled=!n}
  function draw(){
    var out='';
    groups().forEach(function(g){
      var items=expQuery?g.items.filter(function(i){return matchQ(i,expQuery)}):g.items; if(!items.length) return;
      var nSel=g.items.filter(function(i){return exportSel[i.id]}).length, open=expQuery?true:!!expOpen[g.name];
      out+='<div class="gcard" style="margin-bottom:10px"><div class="ghead" style="padding:10px 12px"><input type="checkbox" data-gsel="'+esc(g.name)+'"'+(nSel===g.items.length?' checked':'')+' style="width:20px;height:20px;flex:0 0 20px"><div class="grow etoggle" data-g="'+esc(g.name)+'" style="cursor:pointer"><span class="nm">'+esc(g.name)+'</span> <span class="hint">已選 '+nSel+' / '+g.items.length+'</span></div><span class="etoggle" data-g="'+esc(g.name)+'" style="color:var(--mute);cursor:pointer;padding:0 4px">'+(open?'▾':'▸')+'</span></div>';
      if(open) items.forEach(function(i){var st=statusOf(i);
        out+='<label class="chk" style="padding:9px 12px 9px 34px;margin:0;color:var(--ink);border-bottom:0;border-top:1px solid var(--line)"><input type="checkbox" data-x="'+i.id+'"'+(exportSel[i.id]?' checked':'')+'><span class="grow code">'+(i.code?esc(i.code):'<span class="warn">（未填編號）</span>')+'</span><span class="badge '+st.cls+'">'+st.t+'</span></label>'});
      out+='</div>';
    });
    var el=$('#elist'); el.innerHTML=out||'<div class="card hint">找不到符合的設備。</div>';
    el.querySelectorAll('[data-gsel]').forEach(function(c){var g=groups().find(function(x){return x.name===c.dataset.gsel});var n=g.items.filter(function(i){return exportSel[i.id]}).length;c.indeterminate=n>0&&n<g.items.length;
      c.onchange=function(){g.items.forEach(function(i){exportSel[i.id]=c.checked});draw()}});
    el.querySelectorAll('.etoggle').forEach(function(e){e.onclick=function(){expOpen[e.dataset.g]=!expOpen[e.dataset.g];draw()}});
    el.querySelectorAll('[data-x]').forEach(function(c){c.onchange=function(){exportSel[c.dataset.x]=c.checked;draw()}});
    count();
  }
  $('#eq').oninput=function(){expQuery=$('#eq').value.trim();draw()};
  $('#all').onclick=function(){S.insts.forEach(function(i){exportSel[i.id]=true});draw()};
  $('#none').onclick=function(){S.insts.forEach(function(i){exportSel[i.id]=false});draw()};
  $('#done').onclick=function(){S.insts.forEach(function(i){exportSel[i.id]=statusOf(i).c.filled===3});draw()};
  $('#go').onclick=function(){doExport(S.insts.filter(function(i){return exportSel[i.id]}),$('#go'))};
  draw();
}
function bytesToB64(u){var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function getTpl(){if(TPL_B64&&TPL_B64.indexOf('/*')<0)return b64ToBytes(TPL_B64);var t=lsGet('tc_tpl');return t&&t.b64?b64ToBytes(t.b64):null}
function b64ToBytes(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function deliverBox(fn,blob){return new Promise(function(res){
  var file=null; try{file=new File([blob],fn,{type:blob.type||'application/octet-stream'})}catch(e){}
  var canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="card"><div style="font-weight:600;margin-bottom:6px">檔案已產生</div><div class="hint" style="word-break:break-all;margin-bottom:12px">'+esc(fn)+'</div>'+
    (canShare?'<button class="btn pri" data-a="share" style="width:100%;margin-bottom:8px">傳送（Email、LINE、雲端硬碟…）</button>':'')+
    '<button class="btn'+(canShare?'':' pri')+'" data-a="dl" style="width:100%;margin-bottom:8px">下載到這台裝置</button><button class="btn" data-a="x" style="width:100%">關閉</button></div>';
  m.onclick=async function(e){var a=e.target.getAttribute('data-a');if(!a)return;
    if(a==='share'){try{await navigator.share({files:[file],title:fn})}catch(err){if(err&&err.name!=='AbortError')toast('無法傳送：'+err.message)}return}
    if(a==='dl'){var u=URL.createObjectURL(blob);var l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000);return}
    m.remove();res()};
  document.body.appendChild(m)})}
async function saveFile(fn,blob){
  var dl=null;if(!STANDALONE){try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}}
  if(dl){await dl.save({filename:fn,data:blob});toast('已存檔')}
  else await deliverBox(fn,blob);
}
async function doExport(insts,btn){
  if(!insts.length){toast('請至少選一台');return}
  var list=insts.map(function(i){return {inst:i,rec:S.recs[i.id]}});
  var label=btn.textContent; btn.disabled=true; btn.textContent='產生中…';
  try{
    var tpl=getTpl(); if(!tpl){btn.disabled=false;btn.textContent=label;await confirmBox('還沒有匯入 Word 表單。請到「設定 → Word 表單」匯入表單檔（.docx）後再匯出。');return}
    var blob=await buildDocx(JSZip,tpl,S.settings,list);
    var d=(S.settings.date||new Date().toISOString().slice(0,10)).replace(/-/g,'');
    var fn='一般溫度計查驗報告_'+(insts.length===1?instLabel(insts[0]).replace(/[\\/:*?"<>|\s]+/g,'_')+'_':'')+d+'.docx';
    btn.disabled=false; btn.textContent=label;
    await saveFile(fn,blob);
  }catch(e){ if(e&&e.code==='declined') toast('已取消'); else toast('匯出失敗：'+(e&&(e.message||e.code)||e)) }
  btn.disabled=false; btn.textContent=label;
}

</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
